[workspace]
members = [
    "programs/*"
]
resolver = "1"


[workspace.package]
edition = "2021"
rust-version = "1.89.0"

[workspace.dependencies]
indexmap = "2.2.6"
hashbrown = "=0.14.5"
block-buffer = "=0.10.4"
cpufeatures = "=0.2.17"
crypto-common = "=0.1.7"
anchor-lang = "0.30.1"
anchor-spl = "0.30.1"
solana-program = "=2.1.14"
zeroize = "=1.6.0"
zeroize_derive = "=1.4.2"
toml_datetime = "=0.6.8"
getrandom = "=0.2.17"


[profile.release]
overflow-checks = false
lto = "fat"
codegen-units = 1
opt-level = "z"

[patch.crates-io]
blake3 = { git = "https://github.com/BLAKE3-team/BLAKE3", tag = "1.5.5" }

[workspace.metadata.cli]
solana = "1.18.26"
