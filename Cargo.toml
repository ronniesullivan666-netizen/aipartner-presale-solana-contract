[workspace]
members = [
    "programs/*"
]
resolver = "2"

[workspace.package]
edition = "2021"

[workspace.dependencies]
anchor-lang = "0.30.1"
anchor-spl = "0.30.1"
solana-program = "=2.0.11"
borsh = "=1.5.1"
borsh-derive = "=1.5.1"
indexmap = "=2.3.0"
hashbrown = "=0.14.5"
toml = "=0.8.19"
toml_edit = "=0.22.22"
proc-macro-crate = "=3.1.0"
blake3 = "=1.5.5"
zeroize_derive = "=1.4.2"
jobserver = "=0.1.32"
unicode-segmentation = "=1.12.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
overflow-checks = false
strip = true